<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset your password | Piyarathna Tex</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Request a code to reset your password.">
    <link href="https://fonts.googleapis.com/css?family=Josefin+Sans&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Poppins&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Kaushan+Script&display=swap" rel="stylesheet" />
    <link href="forgotPass.css" rel="stylesheet" />
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Piyarathna Tex">
    <meta property="og:title" content="Reset your password | Piyarathna Tex">
    <meta property="og:description" content="Request a code to reset your password.">
    <meta property="og:image" content="images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="ui.css">
</head>

<body data-auth="forgot">
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <span class="brand-name">Piyarathna Tex</span>
        </div>

        <!-- Main Content -->
        <div class="forgot-password-content">
            <!-- Forgot password heading -->
            <h1 class="forgot-password-heading">Forgot your password?</h1>

            <!-- Instructions -->
            <p class="forgot-password-instruction">Don’t worry, it happens! Just enter your email below, and we’ll send you a six-digit code to reset your password.</p>

            <form id="forgotForm" novalidate>
                <div class="input-field">
                    <input type="email" placeholder="Enter your email" aria-label="Email" id="email" autocomplete="email" required>
                </div>
                <button type="submit" class="send-reset-button">Send reset code</button>
            </form>

            <!-- Back to login link -->
            <div class="auth-links">
                <span>Remember your password? <a href="login.html">Login</a></span>
            </div>
        </div>
    </div>
    <script src="JavaScript/api.js"></script>
    <script src="JavaScript/auth.js"></script>
</body>

</html>
