<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Piyarathna Tex admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/logowhite.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ui.css">
    <style>body { font-family: 'Poppins', sans-serif; margin: 0; color: #1c1c1e; }</style>
</head>
<body data-admin="dashboard">
    <div class="admin_shell">
        <nav class="admin_side">
            <div class="brand">Piyarathna Tex</div>
            <a href="admin-dashboard.html" class="active">Dashboard</a>
            <a href="admin-products.html">Products</a>
            <a href="admin-add-product.html">Add product</a>
            <a href="admin-orders.html">Orders</a>
            <a href="admin-refunds.html">Refunds</a>
            <a href="index.html">View shop</a>
            <a href="#" id="admin_logout">Sign out</a>
        </nav>
        <main class="admin_main">
            <p class="confirm_meta">Signed in as <strong class="admin_who"></strong></p>
            <h1>Dashboard</h1>
            <div class="stat_row">
                <div class="stat"><span>Orders</span><strong id="stat_orders">—</strong></div>
                <div class="stat"><span>Revenue</span><strong id="stat_revenue">—</strong></div>
                <div class="stat"><span>Products</span><strong id="stat_products">—</strong></div>
                <div class="stat"><span>Customers</span><strong id="stat_customers">—</strong></div>
                <div class="stat"><span>Refunds waiting</span><strong id="stat_refunds">—</strong></div>
            </div>
            <h2 class="section_sub">Running low</h2>
            <ul id="low_stock"><li>Loading…</li></ul>
        </main>
    </div>
    <script src="JavaScript/api.js"></script>
    <script src="JavaScript/admin.js"></script>
</body>
</html>
