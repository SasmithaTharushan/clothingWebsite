<body data-auth="register">
  <div class="container">
    <div class="left-panel">
      <h1>Piyarathna Tex</h1>
      <div class="image-wrapper">
        <img src="images/woman/image76.webp" alt="" />
      </div>
    </div>
    <div class="right-panel">
      <h2>Hello! Register to get started</h2>
      <!-- Form with action pointing to register.php for handling data submission -->
      <form id="registerForm" novalidate>
        <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required />
        <input type="password" id="password" name="password" placeholder="Password (8+ chars, with a number)" autocomplete="new-password" minlength="8" required />
        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" required />
        <button type="submit">Register</button>
        <p>Already have an account? <a href="login.html">Login</a></p>
      </form>
    </div>
  </div>
    <script src="JavaScript/api.js"></script>
    <script src="JavaScript/auth.js"></script>
</body>
