<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add product | Piyarathna Tex admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/logowhite.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ui.css">
    <style>body { font-family: 'Poppins', sans-serif; margin: 0; color: #1c1c1e; }</style>
</head>
<body data-admin="add">
    <div class="admin_shell">
        <nav class="admin_side">
            <div class="brand">Piyarathna Tex</div>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="admin-products.html">Products</a>
            <a href="admin-add-product.html" class="active">Add product</a>
            <a href="admin-orders.html">Orders</a>
            <a href="admin-refunds.html">Refunds</a>
            <a href="index.html">View shop</a>
            <a href="#" id="admin_logout">Sign out</a>
        </nav>
        <main class="admin_main">
            <p class="confirm_meta">Signed in as <strong class="admin_who"></strong></p>
            <h1>Add a product</h1>
            <form id="addProductForm" style="max-width:640px">
                <div class="ui_field">
                    <label>Images (first one is the main photo)</label>
                    <div class="upload_grid">
                        <label><input type="file" class="upload_slot" accept="image/*" hidden><img src="images/check.png" alt="Choose image 1"></label>
                        <label><input type="file" class="upload_slot" accept="image/*" hidden><img src="images/check.png" alt="Choose image 2"></label>
                        <label><input type="file" class="upload_slot" accept="image/*" hidden><img src="images/check.png" alt="Choose image 3"></label>
                        <label><input type="file" class="upload_slot" accept="image/*" hidden><img src="images/check.png" alt="Choose image 4"></label>
                    </div>
                </div>
                <div class="ui_field"><label for="name">Product name</label><input id="name" type="text" required></div>
                <div class="ui_row">
                    <div class="ui_field"><label for="category">Category</label><select id="category" required></select></div>
                    <div class="ui_field"><label for="price">Price (USD)</label><input id="price" type="number" min="0" step="0.01" required></div>
                </div>
                <div class="ui_field"><label for="sku">SKU (optional)</label><input id="sku" type="text"></div>
                <div class="ui_field"><label for="description">Description</label><textarea id="description" rows="4"></textarea></div>
                <div class="ui_field">
                    <label>Stock by size</label>
                    <div id="size_rows"></div>
                </div>
                <div class="ui_field">
                    <label style="display:flex;gap:.5rem;align-items:center">
                        <input type="checkbox" id="isTrending" style="width:auto"> Show on the home page
                    </label>
                </div>
                <button type="submit" class="btn_primary" id="save_product">Add product</button>
            </form>
        </main>
    </div>
    <script src="JavaScript/api.js"></script>
    <script src="JavaScript/admin.js"></script>
</body>
</html>
